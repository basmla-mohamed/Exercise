<div id="products" class="py-5">
  <div class="container">
    <h1>Shop Now</h1>

    <div class="row info mb-4">
      <div class="col-lg-6">
        <div class="item">
          <h6>Total Items</h6>
          <p>{{ totalItems() }}</p>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="item">
          <h6>Total Price</h6>
          <p>{{ totalPrice() }}</p>
        </div>
      </div>
    </div>

    <!-- Products -->
    <div class="row">
      @for (product of products(); track product.id) {
        <div class="col-lg-3 col-md-6 mb-4">
          <div class="item cart">
            <div class="head">
              <img src="assets/{{ product.img }}" class="img-fluid" />
            </div>

            <div class="body">
              <div class="content">
                <h2>{{ product.name }}</h2>

                <p>{{ product.description }}</p>

                <div class="row align-items-center">
                  <div class="col-4">
                    <p class="text-decoration-line-through">
                      {{ product.oldPrice }}
                    </p>
                  </div>

                  <div class="col-4">
                    <p>{{ product.newPrice }}</p>
                  </div>

                  <div class="col-4">
                    <button class="btn" (click)="addToCart(product.id)">Add to cart</button>
                  </div>
                </div>

                <p>Quantity: {{ product.quantity }}</p>

                <!--show delete button if the product added to card we must have 1 in quantty at least-->
                @if (product.quantity > 0) {
                  <button class="btn delete w-100" (click)="removeFromCart(product.id)">
                    Remove from cart
                  </button>
                }
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
